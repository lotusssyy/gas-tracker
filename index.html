<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash 110 Gas Tracker</title>
    <meta name="description" content="Track gas expenses for your Suzuki Smash 110 — price per liter, liters filled, and remaining fuel.">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Gas Tracker">
    <link rel="apple-touch-icon" href="icon-180.png">

    <style>
        :root {
            --primary: #0056b3;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --danger: #dc2626;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            text-align: center;
            color: var(--primary);
        }
        h1 {
            font-size: 1.6rem;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: bold;
        }
        input {
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
        }
        input:focus {
            outline: 2px solid var(--primary);
            border-color: var(--primary);
        }
        button {
            padding: 12px 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            min-height: 44px;
        }
        button:hover {
            background-color: #004494;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            text-align: center;
            background-color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            gap: 12px;
        }
        .stat-box {
            flex: 1 1 120px;
            min-width: 100px;
        }
        .stat-box div:last-child {
            font-size: 13px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        tbody tr:hover {
            background-color: #f0f4f8;
        }
        .delete-btn {
            padding: 6px 14px;
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            min-height: 40px;
            margin-top: 0;
        }
        .delete-btn:hover {
            background-color: #b91c1c;
        }
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.35rem;
            }
            .card {
                padding: 16px;
                margin-bottom: 14px;
            }
            .stat-value {
                font-size: 20px;
            }
            .stat-box div:last-child {
                font-size: 12px;
            }
            table, thead, tbody, tr, td {
                display: block;
            }
            thead {
                display: none;
            }
            tbody {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            tr {
                background: var(--card-bg);
                border: 1px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                white-space: normal;
                border-bottom: 1px solid #eee;
                padding: 10px 14px;
            }
            td:last-child {
                border-bottom: none;
                justify-content: flex-end;
            }
            td::before {
                content: attr(data-label);
                font-weight: bold;
                color: var(--primary);
                margin-right: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏍️ Smash 110 Gas Tracker</h1>
    <p style="text-align: center;">Full Tank Capacity: <strong>3.7 Liters</strong></p>

    <div class="card">
        <h2>Add Fuel Expense</h2>
        <form id="gasForm">
            <label for="date">Date:</label>
            <input type="date" id="date" required>

            <label for="pricePerLiter">Price per Liter (PHP):</label>
            <input type="number" id="pricePerLiter" step="0.01" placeholder="e.g., 65" required>

            <label for="cost">Total Cost (PHP):</label>
            <input type="number" id="cost" step="0.01" placeholder="e.g., 150" required>

            <label>Liters Filled:</label>
            <div id="calculatedLiters" style="padding: 10px; background: #e2e8f0; border-radius: 5px; font-size: 18px; font-weight: bold; color: var(--primary);">0.00 L</div>

            <button type="submit">Save Record</button>
        </form>
    </div>

    <div class="card">
        <h2>Overall Summary</h2>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="totalLiters">0.0</div>
                <div>Total Liters</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalCost">₱0</div>
                <div>Total Spent</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="tankEquivalent">0</div>
                <div>Full Tanks (3.7L)</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="lastGasLeft">--</div>
                <div>Gas Left (Last Fill)</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Fuel History</h2>
        <div class="table-wrap">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Liters</th>
                        <th>Gas Left</th>
                        <th>Price/L</th>
                        <th>Cost</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const FULL_TANK_CAPACITY = 3.7;
    let records = JSON.parse(localStorage.getItem('smash110_gas_records')) || [];

    document.getElementById('date').valueAsDate = new Date();
    const gasForm = document.getElementById('gasForm');
    const historyTableBody = document.querySelector('#historyTable tbody');
    const pricePerLiterInput = document.getElementById('pricePerLiter');
    const costInput = document.getElementById('cost');
    const calculatedLitersDisplay = document.getElementById('calculatedLiters');

    function updateCalculatedLiters() {
        const price = parseFloat(pricePerLiterInput.value);
        const cost = parseFloat(costInput.value);
        if (price > 0 && cost > 0) {
            calculatedLitersDisplay.innerText = (cost / price).toFixed(2) + ' L';
        } else {
            calculatedLitersDisplay.innerText = '0.00 L';
        }
    }

    pricePerLiterInput.addEventListener('input', updateCalculatedLiters);
    costInput.addEventListener('input', updateCalculatedLiters);

    gasForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('date').value;
        const pricePerLiter = parseFloat(pricePerLiterInput.value);
        const cost = parseFloat(costInput.value);
        const liters = Math.round((cost / pricePerLiter) * 100) / 100;

        const newRecord = { id: Date.now(), date, liters, cost, pricePerLiter };
        records.push(newRecord);
        records.sort((a, b) => new Date(b.date) - new Date(a.date));

        saveData();
        updateUI();
        gasForm.reset();
        document.getElementById('date').valueAsDate = new Date();
        calculatedLitersDisplay.innerText = '0.00 L';
    });

    function deleteRecord(id) {
        records = records.filter(record => record.id !== id);
        saveData();
        updateUI();
    }

    function saveData() {
        localStorage.setItem('smash110_gas_records', JSON.stringify(records));
    }

    function gasLeftFor(record) {
        return Math.min(Math.max(FULL_TANK_CAPACITY - record.liters, 0), FULL_TANK_CAPACITY);
    }

    function updateUI() {
        historyTableBody.innerHTML = '';
        let totalLiters = 0;
        let totalCost = 0;

        records.forEach(record => {
            totalLiters += record.liters;
            totalCost += record.cost;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td data-label="Date">${record.date}</td>
                <td data-label="Liters">${record.liters.toFixed(2)} L</td>
                <td data-label="Gas Left">${gasLeftFor(record).toFixed(2)} L</td>
                <td data-label="Price/L">₱${(record.pricePerLiter || record.cost / record.liters).toFixed(2)}/L</td>
                <td data-label="Cost">₱${record.cost.toFixed(2)}</td>
                <td data-label=""><button class="delete-btn" onclick="deleteRecord(${record.id})">Delete</button></td>
            `;
            historyTableBody.appendChild(row);
        });

        document.getElementById('totalLiters').innerText = totalLiters.toFixed(2);
        document.getElementById('totalCost').innerText = `₱${totalCost.toFixed(2)}`;
        document.getElementById('tankEquivalent').innerText = (totalLiters / FULL_TANK_CAPACITY).toFixed(1) + 'x';
        document.getElementById('lastGasLeft').innerText = records.length > 0 ? gasLeftFor(records[0]).toFixed(2) + ' L' : '--';
    }

    updateUI();

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('ServiceWorker registered successfully.');
                })
                .catch(error => {
                    console.log('ServiceWorker registration failed:', error);
                });
        });
    }
</script>
</body>
</html>
